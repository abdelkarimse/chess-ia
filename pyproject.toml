[project]
name = "chess-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abdelkarim", email = "aselmi716@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lap>=0.5.14",
    "numpy>=2.5.4",
